<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a146e" />
      <stop offset="100%" stop-color="#0071eb" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Outer Globe Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffffff" stroke-width="12" stroke-opacity="0.25" />
  
  <!-- Latitudinal & Longitudinal Orbits -->
  <ellipse cx="256" cy="256" rx="80" ry="170" fill="none" stroke="#ffffff" stroke-width="10" stroke-opacity="0.2" />
  <line x1="86" y1="256" x2="426" y2="256" stroke="#ffffff" stroke-width="10" stroke-opacity="0.2" />

  <!-- Dynamic Exchange Arrows -->
  <!-- Top Arrow (Moving Right) -->
  <path d="M 170 190 L 320 190 M 295 160 L 325 190 L 295 220" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom Arrow (Moving Left) -->
  <path d="M 342 322 L 192 322 M 217 292 L 187 322 L 217 352" fill="none" stroke="url(#gold)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Currency Badge -->
  <circle cx="256" cy="256" r="54" fill="#0a146e" stroke="#ffffff" stroke-width="8" />
  <text x="256" y="274" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">Xe</text>
</svg>
